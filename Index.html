<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpha Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0b0f17] text-white font-sans p-4">

    <!-- Top Header -->
    <div class="max-w-md mx-auto mb-6">
        <div class="border border-slate-700 rounded-full py-2 px-4 flex items-center justify-center gap-2 w-fit bg-[#121824]">
            <span class="text-cyan-400 font-bold">⚡</span>
            <span class="text-sm tracking-wide font-semibold">ALPHA STORE</span>
        </div>
    </div>

    <!-- Main Container -->
    <div class="max-w-md mx-auto space-y-6">

        <!-- Browse Section -->
        <div class="bg-[#121824] border border-slate-800 rounded-2xl p-4">
            <p class="text-xs text-slate-400 mb-2 uppercase tracking-wider">Browse</p>
            <h2 class="text-lg font-bold mb-4">Card categories</h2>
            
            <div class="flex gap-2">
                <button class="bg-blue-600 text-white px-4 py-2 rounded-xl text-sm font-medium flex items-center gap-2 shadow-lg shadow-blue-600/30">
                    <span>💳</span> All cards <span class="bg-blue-800 text-xs px-2 py-0.5 rounded-full">40</span>
                </button>
                <button class="bg-[#1a2333] text-slate-300 px-4 py-2 rounded-xl text-sm font-medium flex items-center gap-2 border border-slate-700">
                    <span>🎟️</span> Play Store Codes <span class="text-xs text-slate-400">18</span>
                </button>
            </div>
        </div>

        <!-- Collection Header -->
        <div>
            <p class="text-xs text-slate-400 uppercase tracking-wider mb-1">Collection</p>
            <div class="flex justify-between items-center">
                <h2 class="text-2xl font-bold">Available cards</h2>
                <span class="text-xs text-slate-400 border border-slate-800 px-3 py-1 rounded-full">40 items</span>
            </div>
        </div>

        <!-- Card Item 1 -->
        <div class="bg-[#121824] border border-slate-800 rounded-2xl p-5 relative overflow-hidden shadow-xl">
            <div class="flex justify-between items-start mb-4">
                <h3 class="text-orange-500 font-bold tracking-widest text-sm">MASTERCARD</h3>
                <span class="bg-purple-950 text-purple-300 text-[10px] font-bold px-2.5 py-1 rounded-full border border-purple-800/50">PREMIUM</span>
            </div>

            <div class="bg-[#0b0f17] border border-slate-800/80 rounded-xl py-3 px-4 text-center mb-4">
                <p class="font-mono tracking-widest text-lg text-slate-200">8653 46XX XXXX XXXX</p>
            </div>

            <div class="mb-5">
                <p class="text-sm font-semibold text-slate-200">HUSSET G.</p>
                <p class="text-xs text-slate-400">Standard</p>
            </div>

            <div class="flex justify-between items-center pt-2 border-t border-slate-800/60">
                <div>
                    <span class="text-orange-400 font-bold text-lg">₹254</span>
                </div>
                <div class="text-right">
                    <p class="text-[10px] text-slate-400 uppercase tracking-wider">Balance</p>
                    <p class="text-emerald-400 font-bold text-base">₹3425</p>
                </div>
            </div>

            <button class="w-full mt-4 bg-blue-600 hover:bg-blue-500 transition-colors text-white py-3 rounded-xl font-medium text-sm flex items-center justify-center gap-2 shadow-lg shadow-blue-600/20">
                Get Item &rarr;
            </button>
        </div>

        <!-- Support Section -->
        <div class="text-center mt-8">
            <a href="https://t.me/AlphaStoreSupport" class="text-sm text-slate-400 hover:text-white transition underline">Need help? Message Support</a>
        </div>

    </div>

</body>
</html>
